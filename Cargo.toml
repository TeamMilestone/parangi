[workspace]
resolver = "2"
members = [
    "crates/parang",
    "crates/parang-cli",
    "crates/pdf-oxide-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"
authors = ["Wonsup Lee <onesup.lee@gmail.com>"]

[workspace.dependencies]
lopdf = { path = "../lopdf" }
rayon = "1.10"
memmap2 = "0.9"
encoding_rs = "0.8"
unicode-normalization = "0.1"
unicode-bidi = "0.3"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
mimalloc = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
